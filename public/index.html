<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript Tracker | Registrar Demonstration</title>
  <link rel="stylesheet" href="styles.css">
  <script src="client.js" defer></script>
</head>
<body>
  <header>
    <div class="shell masthead">
      <div><p class="eyebrow">SWE2106 · Registrar project</p><h1>Transcript Tracker</h1></div>
      <button id="signout" class="secondary" hidden>Sign out</button>
    </div>
  </header>
  <main class="shell">
    <p id="message" role="status" aria-live="polite" hidden></p>
    <!-- Sign-in screen shown when the page first opens. -->
    <section id="signin" class="panel signin">
      <p class="eyebrow">Account access</p>
      <h2>Sign in</h2>
      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button>Sign in</button>
      </form>
      <p>New student? <button id="open-register" type="button" class="secondary">Create account</button></p>
    </section>
    <!-- Students can create an account before signing in. -->
    <section id="register" class="panel signin" hidden>
      <h2>Create a student account</h2>
      <form id="register-form">
        <label for="register-name">Full name</label>
        <input id="register-name" name="name" autocomplete="name" maxlength="100" required>
        <label for="register-email">Student email address</label>
        <input id="register-email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="name@std.must.ac.ug" required>
        <label for="register-password">Password</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" aria-describedby="register-password-help" required>
        <p id="register-password-help">Use at least 8 characters.</p>
        <button>Create account</button>
      </form>
      <p>Already registered? <button id="back-to-login" type="button" class="secondary">Back to sign in</button></p>
    </section>
    <!-- The account role decides which workspace controls are shown. -->
    <section id="workspace" hidden>
      <div class="welcome"><p class="eyebrow" id="account-role"></p><h2 id="account-name"></h2></div>
      <!-- Show saved updates when the student returns or while the dashboard is open. -->
      <section id="updates-panel" class="panel" hidden>
        <h2>Registrar notifications</h2>
        <p id="updates-announcement" role="status"></p>
        <ul id="updates-list" class="updates-list"></ul>
      </section>
      <div class="layout">
        <section class="panel" id="create-panel" hidden>
          <h2>New request</h2>
          <form id="request-form">
            <label for="purpose">Reason for requesting a transcript</label>
            <textarea id="purpose" name="purpose" minlength="5" maxlength="300" rows="4" required></textarea>
            <button>Submit request</button>
          </form>
        </section>
        <section class="panel">
          <div class="section-top"><h2 id="queue-title">Requests</h2><button id="refresh" class="secondary">Refresh</button></div>
          <ul id="request-list"></ul>
        </section>
      </div>
      <!-- Show the selected request here, with review controls for staff. -->
      <section class="panel detail" id="detail" hidden aria-labelledby="detail-title">
        <h2 id="detail-title" tabindex="-1">Request details</h2>
        <p id="reference"></p>
        <p id="request-purpose"></p>
        <h3>Status history</h3>
        <ol id="history"></ol>
        <form id="review-form" hidden>
          <label for="status">Next status</label>
          <select id="status" name="status" required></select>
          <label for="note">Review note</label>
          <textarea id="note" name="note" maxlength="300" rows="2"></textarea>
          <button>Update status</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
